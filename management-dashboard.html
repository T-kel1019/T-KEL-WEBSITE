<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>T-KEL Management Dashboard</title>

    <meta name="description"
          content="T-KEL Management member dashboard.">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .header img {
            width: 170px;
            max-width: 75%;
            height: auto;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 18px 40px;
        }

        .welcome {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .welcome h1 {
            margin-top: 0;
            color: #007BFF;
        }

        .welcome p {
            line-height: 1.6;
        }

        .account-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .account-card {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #e3e3e3;
        }

        .account-card strong {
            display: block;
            margin-bottom: 7px;
            color: #555;
        }

        .account-card span {
            font-weight: bold;
        }

        .dashboard-area,
        .password-change-section,
        .my-reports-section {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .dashboard-area h2,
        .password-change-section h2,
        .my-reports-section h2 {
            color: #007BFF;
            margin-top: 0;
        }

        .dashboard-area p,
        .password-change-section p,
        .my-reports-section p {
            line-height: 1.6;
        }

        .module {
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
            background: #fafafa;
        }

        .module h3 {
            margin-top: 0;
        }

        .management-report-section {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .management-report-section h3 {
            margin-top: 0;
        }

        .password-change-section form,
        .management-report-section form {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .form-button {
            margin-top: 18px;
            padding: 12px 20px;
            background: #007BFF;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .report-card {
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
            background: #fafafa;
        }

        .report-card h3 {
            margin-top: 0;
            color: #007BFF;
        }

        .report-status {
            font-weight: bold;
        }

        .director-response {
            margin-top: 15px;
            padding: 15px;
            background: #ffffff;
            border-left: 4px solid #007BFF;
        }

        .logout-button {
            margin-top: 25px;
            padding: 13px 22px;
            background: #007BFF;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-button:hover {
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            font-size: 18px;
        }

        .error {
            max-width: 500px;
            margin: 60px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .error h2 {
            color: #b00020;
        }

        .error button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #007BFF;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }
      /* =========================================
   PRO MANAGEMENT WORKSPACE
========================================= */

.pro-workspace {
    margin-top: 20px;
}

.pro-module {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    margin-top: 18px;
}

.pro-module h3 {
    margin-top: 0;
    color: #007BFF;
}

.pro-module p {
    line-height: 1.6;
}

.pro-card {
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    margin-top: 12px;
}

.pro-card h4 {
    margin-top: 0;
    color: #007BFF;
}

.pro-card p {
    margin: 8px 0;
}

.pro-list {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px;
    margin-top: 15px;
}

.pro-stat {
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
}

.pro-stat strong {
    display: block;
    color: #555;
    margin-bottom: 6px;
}

.pro-stat span {
    font-size: 22px;
    font-weight: bold;
    color: #007BFF;
}

.pro-action-button {
    margin-top: 10px;
    padding: 10px 16px;
    background: #007BFF;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.pro-action-button:hover {
    opacity: 0.9;
}

.pro-secondary-button {
    margin-top: 10px;
    padding: 10px 16px;
    background: #ffffff;
    color: #007BFF;
    border: 1px solid #007BFF;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.pro-secondary-button:hover {
    background: #f0f6ff;
}

.pro-message {
    margin-top: 12px;
    font-weight: bold;
    line-height: 1.5;
}

.pro-empty {
    padding: 15px;
    background: #ffffff;
    border: 1px dashed #ccc;
    border-radius: 8px;
    margin-top: 12px;
}

.pro-priority {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 5px;
    background: #eef5ff;
    color: #007BFF;
    font-size: 13px;
    font-weight: bold;
}

.pro-status {
    font-weight: bold;
}

.pro-textarea {
    min-height: 130px;
}

@media (max-width: 600px) {

    .pro-module {
        padding: 15px;
    }

    .pro-card {
        padding: 14px;
    }

    .pro-list {
        grid-template-columns: 1fr;
    }

    .pro-action-button,
    .pro-secondary-button {
        width: 100%;
    }

}
      /* =========================================
   FOUNDER MASTER WORKSPACE
========================================= */

.founder-workspace {

}

.founder-banner {
    background: #061a3a;
    color: #ffffff;
    padding: 24px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.founder-banner h3 {
    margin-top: 0;
    color: #ffffff;
}

.founder-banner p {
    line-height: 1.6;
}

.founder-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #007BFF;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
}

.founder-module {
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    margin-top: 18px;
}

.founder-module h3 {
    margin-top: 0;
    color: #007BFF;
}

.founder-module p {
    line-height: 1.6;
}

.founder-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.founder-card {
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 18px;
}

.founder-card h4 {
    margin-top: 0;
    color: #007BFF;
}

.founder-card p {
    line-height: 1.5;
}

.founder-rule {
    background: #ffffff;
    border-left: 4px solid #007BFF;
    padding: 15px;
    margin-top: 12px;
    border-radius: 5px;
}

.founder-rule strong {
    display: block;
    margin-bottom: 6px;
}

.founder-action {
    margin-top: 10px;
    padding: 11px 16px;
    background: #007BFF;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.founder-action:hover {
    opacity: 0.9;
}

.founder-secondary {
    margin-top: 10px;
    padding: 11px 16px;
    background: #ffffff;
    color: #007BFF;
    border: 1px solid #007BFF;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.founder-secondary:hover {
    background: #f0f6ff;
}

.founder-note {
    background: #eef6ff;
    border-left: 4px solid #007BFF;
    padding: 15px;
    margin-top: 15px;
    line-height: 1.6;
}

@media (max-width: 600px) {

    .founder-module {
        padding: 15px;
    }

    .founder-card {
        padding: 15px;
    }

    .founder-action,
    .founder-secondary {
        width: 100%;
    }

}

    </style>

</head>

<body>

<header class="header">

    <img
        src="T-KEL logo.png"
        alt="T-KEL Logo">

</header>


<main class="container" id="dashboard">

    <div class="loading">
        Checking Management session...
    </div>

</main>


<script>

async function loadManagementDashboard() {

    const dashboard =
        document.getElementById("dashboard");

    try {

        const response =
            await fetch(
                "/.netlify/functions/management-session",
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );

        const result =
            await response.json();

        if (!response.ok || !result.success) {

            window.location.href =
                "management-login.html";

            return;
        }

        const management =
            result.management;

        const role =
            management.assignedRole || "Management";


        dashboard.innerHTML = `

            <section class="welcome">

                <h1>
                    Welcome, ${escapeHTML(management.fullName)}
                </h1>

                <p>
                    Welcome to the T-KEL Management workspace.
                </p>

                <div class="account-grid">

                    <div class="account-card">
                        <strong>Management ID</strong>
                        <span>
                            ${escapeHTML(
                                management.managementId
                            )}
                        </span>
                    </div>

                    <div class="account-card">
                        <strong>Role</strong>
                        <span>
                            ${escapeHTML(role)}
                        </span>
                    </div>

                    <div class="account-card">
                        <strong>Department</strong>
                        <span>
                            ${escapeHTML(
                                management.department ||
                                "Not assigned"
                            )}
                        </span>
                    </div>

                    <div class="account-card">
                        <strong>Account Status</strong>
                        <span>
                            ${escapeHTML(
                                management.accountStatus
                            )}
                        </span>
                    </div>

                </div>

            </section>


            <section class="dashboard-area">

                <h2>
                    Management Workspace
                </h2>

                <div id="roleWorkspace"></div>

            </section>


            <section class="password-change-section">

                <h2>
                    Change Password
                </h2>

                <p>
                    Change your Management account password.
                    You will be required to log in again
                    after changing it.
                </p>

                <form
                    onsubmit="changeManagementPassword(event)">

                    <label for="currentManagementPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentManagementPassword"
                        autocomplete="current-password"
                        required
                    >

                    <label for="newManagementPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newManagementPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <label for="confirmManagementPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmManagementPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="submit"
                        class="form-button">
                        Change Password
                    </button>

                    <div
                        id="passwordChangeMessage"
                        class="message">
                    </div>

                </form>

            </section>


            <section class="my-reports-section">

                <h2>
                    My Reports
                </h2>

                <p>
                    View reports you have submitted and
                    track their current status and
                    Management responses.
                </p>

                <button
                    type="button"
                    class="form-button"
                    onclick="loadMyReports()">

                    Load My Reports

                </button>

                <div
                    id="myReportsMessage"
                    class="message">
                </div>

                <div
                    id="myReportsContainer">
                </div>

            </section>


            <button
                class="logout-button"
                id="logoutButton">

                Logout

            </button>

        `;


        buildRoleWorkspace(
            management.assignedRole
        );


        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                logoutManagement
            );


    } catch (error) {

        console.error(error);

        dashboard.innerHTML = `

            <div class="error">

                <h2>
                    Connection Error
                </h2>

                <p>
                    We could not verify your
                    Management session.
                </p>

                <button
                    onclick="location.href='management-login.html'">

                    Return to Login

                </button>

            </div>

        `;

    }

}

        String(role || "").trim().toLowerCase();

async function submitManagementReport(event) {

    event.preventDefault();


    const reportType =
        document.getElementById(
            "reportType"
        ).value;


    const description =
        document.getElementById(
            "reportDescription"
        ).value.trim();


    const message =
        document.getElementById(
            "reportMessage"
        );


    if (!reportType || !description) {

        message.textContent =
            "Please complete the report.";

        return;
    }


    message.textContent =
        "Submitting report...";


    try {

        const response =
            await fetch(
                "/.netlify/functions/management-submit-report",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        reportType:
                            reportType,
                        description:
                            description
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to submit report."
            );

        }


        message.textContent =
            "Report submitted successfully. Report ID: " +
            data.reportId;


        document.getElementById(
            "reportDescription"
        ).value = "";


        document.getElementById(
            "reportType"
        ).value = "";


    } catch (error) {

        console.error(
            "Report submission error:",
            error
        );


        message.textContent =
            error.message ||
            "Unable to submit report.";

    }

}


async function loadMyReports() {

    const message =
        document.getElementById(
            "myReportsMessage"
        );


    const container =
        document.getElementById(
            "myReportsContainer"
        );


    message.textContent =
        "Loading your reports...";


    container.innerHTML = "";


    try {

        const response =
            await fetch(
                "/.netlify/functions/management-my-reports",
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load reports."
            );

        }


        const reports =
            data.reports || [];


        message.textContent =
            reports.length === 0
                ? "You have not submitted any reports yet."

        if (reports.length === 0) {
            return;
        }


        container.innerHTML =
            reports.map(report => {

                const createdDate =
                    new Date(
                        report.created_at
                    ).toLocaleString();


                const updatedDate =
                    report.updated_at
                        ? new Date(
                            report.updated_at
                        ).toLocaleString()
                        : "—";


                return `

                    <div class="report-card">

                        <h3>
                            ${escapeHTML(
                                report.report_type
                            )}
                        </h3>


                        <p>
                            <strong>
                                Report ID:

                                report.report_id
                            )}
                        </p>


                        <p>
                            <strong>

                            </strong>

                            ${escapeHTML(
                                createdDate
                            )}
                        </p>


                        <p>
                            <strong>
                                Status:
                            </strong>

                            <span class="report-status">

                                ${escapeHTML(
                                    report.status
                                )}

                            </span>

                        </p>


                        <p>
                            <strong>
                                Description:
                            </strong>
                        </p>


                        <p>
                            ${escapeHTML(
                                report.description
                            )}
                        </p>


                        <p>
                            <strong>
                                Last Updated:
                            </strong>

                            ${escapeHTML(
                                updatedDate
                            )}
                        </p>


                        <div class="director-response">

                            <strong>
                                Management Response:

                            <p>

                                ${
                                    report.director_response
                                        ? escapeHTML(
                                            report.director_response
                                        )
                                        : "No response yet."
                                }

                            </p>

                        </div>

                    </div>

                `;

            }).join("");


    } catch (error) {

        console.error(

        );


        message.textContent =

            "Unable to load your reports.";

    }

}


async function changeManagementPassword(event) {

    event.preventDefault();


    const currentPassword =
        document.getElementById(
            "currentManagementPassword"
        ).value;


    const newPassword =
        document.getElementById(
            "newManagementPassword"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmManagementPassword"
        ).value;


    const messageElement =
        document.getElementById(
            "passwordChangeMessage"
        );


    messageElement.textContent = "";


    if (newPassword !== confirmPassword) {

        messageElement.textContent =
            "The new passwords do not match.";

        return;

    }


    if (newPassword.length < 8) {

        messageElement.textContent =
            "New password must be at least 8 characters.";

        return;

    }


    if (!window.confirm(
        "Are you sure you want to change your password?"
    )) {

        return;

    }


    messageElement.textContent =
        "Changing password...";


    try {

        const response =
            await fetch(
                "/.netlify/functions/management-change-password",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    credentials: "include",
                    cache: "no-store",
                    body: JSON.stringify({
                        currentPassword:
                            currentPassword,
                        newPassword:
                            newPassword
                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Unable to change password."
            );

        }


        messageElement.textContent =
            result.message ||
            "Password changed successfully.";


        document.getElementById(
            "currentManagementPassword"
        ).value = "";


        document.getElementById(
            "newManagementPassword"
        ).value = "";


        document.getElementById(
            "confirmManagementPassword"
        ).value = "";


        setTimeout(function () {

            window.location.href =
                "management-login.html";

        }, 1500);


    } catch (error) {

        console.error(
            "Password change error:",
            error
        );


        messageElement.textContent =
            error.message ||
            "Unable to change password.";

    }

}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

async function proLoadPeopleDirectory() {

    const container =

        );

        document.getElementById(
            "proCommunicationRecipients"
        );

    if (!container) return;

    container.innerHTML =
        `<div class="pro-message">
            Loading people directory...
        </div>`;

    try {

        const response =
            await fetch(
                "/.netlify/functions/pro-people-directory",
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Unable to load people directory."
            );
        }

        const people =
            data.people || [];

        if (recipientSelect) {

            recipientSelect.innerHTML = "";

            people.forEach(person => {

                const option =
                    document.createElement("option");

                option.value =
                    person.id;

                option.textContent =

        container.innerHTML =

                            ${escapeHTML(
                                person.fullName
                            )}
                        </h4>

                        <p>
                            <strong>Management ID:</strong>
                            ${escapeHTML(
                                person.managementId
                            )}
                        </p>

                        <p>
                            <strong>Role:</strong>
                            ${escapeHTML(
                                person.assignedRole ||
                                "Not assigned"
                            )}
                        </p>

                        <p>
                            <strong>Department:</strong>
                            ${escapeHTML(
                                person.department ||
                                "Not assigned"
                            )}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            ${escapeHTML(
                                person.email ||
                                "Not available"
                            )}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${escapeHTML(
                                person.phone ||
                                "Not available"
                            )}
                        </p>

                    </div>
                `;

            }).join("");

    } catch (error) {

        console.error(
            "People directory error:",
            error
        );

        container.innerHTML = `
            <div class="pro-message">
                ${escapeHTML(
                    error.message ||
                    "Unable to load people directory."
                )}
            </div>

    }

/* =========================================
   SEND COMMUNICATION
========================================= */

async function proSendCommunication(event) {

    event.preventDefault();

    const subject =
        document.getElementById(
            "proCommunicationSubject"
        ).value.trim();

    const priority =
        document.getElementById(
            "proCommunicationPriority"
        ).value;

    const message =
    document.getElementById(
        "proCommunicationText"
    ).value.trim();

    const recipientsSelect =
        document.getElementById(
            "proCommunicationRecipients"
        );

    const messageBox =
        document.getElementById(
            "proCommunicationMessage"
        );

    const selectedRecipients =
        Array.from(
            recipientsSelect.selectedOptions
        ).map(option => option.value);

    if (
        !subject ||
        !message ||
        !selectedRecipients.length
    ) {

        document.getElementById(
            "proCommunicationMessage"
        ).textContent =
            "Please complete the communication and select at least one recipient.";

        return;
    }

    const statusBox =
        document.getElementById(
            "proCommunicationMessage"
        );

    statusBox.textContent =
        "Sending communication...";

    try {

        const response =
            await fetch(
                "/.netlify/functions/pro-send-communication",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({

                        subject:
                            subject,

                        message:
                            message,

                        priority:
                            priority,

                        recipientAccountIds: selectedRecipients

                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to send communication."
            );
        }

        statusBox.textContent =
            "Communication sent successfully.";

        document.getElementById(
            "proCommunicationSubject"
        ).value = "";

        document.getElementById(
    "proCommunicationText"
).value = "";

        recipientsSelect.selectedIndex = -1;

        await proLoadCommunicationHistory();

    } catch (error) {

        console.error(
            "PRO communication error:",
            error
        );

        statusBox.textContent =
            error.message ||
            "Unable to send communication.";
    }
}

        document.getElementById(
            "proFollowUpPriority"
        ).value;

    const dueDate =
        document.getElementById(

        ).value;

    const description =
        document.getElementById(
            "proFollowUpDescription"

    const message =
        document.getElementById(

    message.textContent =

        const response =
            await fetch(

        message.textContent =
            error.message ||
            "Unable to create follow-up.";
