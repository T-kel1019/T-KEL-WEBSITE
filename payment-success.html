<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Successful — T-KEL</title>

<link rel="stylesheet" href="style.css">

<style>

.payment-box {
    max-width: 650px;
    margin: 40px auto;
    padding: 30px 20px;
    text-align: center;
    box-sizing: border-box;
}

.payment-box img {
    width: 220px;
    max-width: 80%;
    height: auto;
    margin-bottom: 20px;
}

.payment-status {
    font-size: 18px;
    font-weight: bold;
    margin: 20px 0;
}

.payment-details {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: left;
    background: #f9f9f9;
}

.payment-details p {
    margin: 10px 0;
    word-break: break-word;
}

.continue-button {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 25px auto 0;
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.continue-button:hover {
    opacity: 0.9;
}

.back-link {
    display: block;
    margin-top: 25px;
}

</style>

</head>


<body>


<section class="content payment-box">


<img
    src="T-KEL logo.png"
    alt="T-KEL Logo"
>


<h1>Payment Verification</h1>


<p>
Terriken Entertainment Limited (T-KEL)
</p>


<div
    id="payment-message"
    class="payment-status"
>
Verifying your payment...
</div>


<div
    id="payment-details"
    class="payment-details"
>


<p>
<strong>Payment Reference:</strong><br>
<span id="payment-reference"></span>
</p>


<p>
<strong>Application Reference:</strong><br>
<span id="application-reference"></span>
</p>


<p>
<strong>Applicant:</strong><br>
<span id="applicant-name"></span>
</p>


<p>
<strong>Category:</strong><br>
<span id="application-category"></span>
</p>


<p>
<strong>Amount Paid:</strong><br>
₦5,000
</p>


<p>
Your payment has been successfully verified by T-KEL.
</p>


<button
    type="button"
    id="continue-button"
    class="continue-button"
>
Continue to Application Form
</button>


</div>


<a
    href="index.html"
    class="back-link"
>
← Back to T-KEL Website
</a>


</section>



<script>


async function verifyPayment() {


    const message =
        document.getElementById(
            "payment-message"
        );


    const details =
        document.getElementById(
            "payment-details"
        );


    const paymentReferenceElement =
        document.getElementById(
            "payment-reference"
        );


    const applicationReferenceElement =
        document.getElementById(
            "application-reference"
        );


    const applicantNameElement =
        document.getElementById(
            "applicant-name"
        );


    const categoryElement =
        document.getElementById(
            "application-category"
        );


    const continueButton =
        document.getElementById(
            "continue-button"
        );


    /*
    ==========================================
    GET PAYSTACK REFERENCE
    ==========================================
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const reference =
        params.get("reference") ||
        params.get("trxref");


    if (!reference) {

        message.textContent =
            "❌ Payment reference was not found.";

        return;

    }


    /*
    ==========================================
    VERIFY PAYMENT ON SERVER
    ==========================================
    */

    try {


        message.textContent =
            "Verifying your payment...";


        const response =
            await fetch(
                "/.netlify/functions/verify-payment",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            reference:
                                reference
                        })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.paid
        ) {

            throw new Error(
                result.error ||
                "Payment could not be verified."
            );

        }


        /*
        ==========================================
        DISPLAY VERIFIED PAYMENT
        ==========================================
        */

        paymentReferenceElement.textContent =
            result.paymentReference ||
            reference;


        applicationReferenceElement.textContent =
            result.applicationReference ||
            "Not available";


        applicantNameElement.textContent =
            result.fullName ||
            "Not available";


        categoryElement.textContent =
            result.category ||
            "Not available";


        message.textContent =
            "✅ Your ₦5,000 payment has been verified successfully.";


        details.style.display =
            "block";


        /*
        ==========================================
        CONTINUE TO APPLICATION FORM
        ==========================================
        */

        continueButton.onclick =
            function() {


                const paymentRef =
                    result.paymentReference ||
                    reference;


                const applicationRef =
                    result.applicationReference ||
                    "";


                const formUrl =
                    "application-form.html?" +
                    "payment=" +
                    encodeURIComponent(
                        paymentRef
                    ) +
                    "&reference=" +
                    encodeURIComponent(
                        applicationRef
                    );


                window.location.href =
                    formUrl;

            };


    } catch (error) {


        console.error(
            "Payment verification error:",
            error
        );


        message.textContent =
            "❌ " +
            error.message;


    }

}


/*
==========================================
START VERIFICATION
==========================================
*/

verifyPayment();

</script>


</body>

</html>
