<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | T-KEL Distribution</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">
        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                <img src="T-KEL logo.png" alt="T-KEL Logo">
            </a>

            <p class="eyebrow">T-KEL DISTRIBUTION</p>

            <h1 id="pageTitle">Reset Password</h1>

            <p class="auth-subtitle" id="pageSubtitle">
                Enter your artist account email to receive a password reset link.
            </p>

            <!-- REQUEST RESET EMAIL -->
            <form id="resetRequestForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your account email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div id="requestMessage" class="form-message"></div>

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                    id="requestButton"
                >
                    Send Reset Link
                </button>

            </form>

            <!-- SET NEW PASSWORD -->
            <form id="newPasswordForm" style="display:none;">

                <div class="form-group">
                    <label for="newPassword">New Password</label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div id="passwordMessage" class="form-message"></div>

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                    id="updateButton"
                >
                    Update Password
                </button>

            </form>

            <p class="auth-link">
                Remember your password?
                <a href="artist-login.html">Back to Login</a>
            </p>

            <p class="auth-slogan">Stay Real, Stay kelz.</p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://tvefankphzactrtciuwp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_yRe3y1xhJO_OFEVQpxopxg_1mR7gmqf";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    flowType: "implicit",
                    detectSessionInUrl: true,
                    persistSession: true,
                    autoRefreshToken: true
                }
            }
        );

        const resetRequestForm =
            document.getElementById("resetRequestForm");

        const newPasswordForm =
            document.getElementById("newPasswordForm");

        const requestMessage =
            document.getElementById("requestMessage");

        const passwordMessage =
            document.getElementById("passwordMessage");

        const pageTitle =
            document.getElementById("pageTitle");

        const pageSubtitle =
            document.getElementById("pageSubtitle");

        const requestButton =
            document.getElementById("requestButton");

        const updateButton =
            document.getElementById("updateButton");

        let recoveryDetected = false;

        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = "form-message " + type;
        }

        function showRecoveryForm() {
            recoveryDetected = true;

            resetRequestForm.style.display = "none";
            newPasswordForm.style.display = "block";

            pageTitle.textContent = "Choose a New Password";

            pageSubtitle.textContent =
                "Enter and confirm your new T-KEL Distribution password.";

            /*
             * Remove recovery tokens from the address bar
             * after Supabase has processed them.
             */
            if (window.location.hash) {
                history.replaceState(
                    null,
                    document.title,
                    window.location.pathname + window.location.search
                );
            }
        }

        function showRequestForm() {
            resetRequestForm.style.display = "block";
            newPasswordForm.style.display = "none";

            pageTitle.textContent = "Reset Password";

            pageSubtitle.textContent =
                "Enter your artist account email to receive a password reset link.";
        }

        /*
         * Handle the recovery link and any existing session.
         */
        supabaseClient.auth.onAuthStateChange(
            async function (event, session) {

                if (event === "PASSWORD_RECOVERY") {
                    showRecoveryForm();
                    return;
                }

                if (event === "SIGNED_IN" && session) {
                    /*
                     * Do not show the password form for an
                     * ordinary sign-in. A valid recovery event
                     * is required.
                     */
                    return;
                }
            }
        );

        /*
         * Inspect the recovery URL.
         */
        async function initializeRecoveryPage() {
            const hash = window.location.hash;
            const params = new URLSearchParams(
                window.location.search
            );

            const hashParams = new URLSearchParams(
                hash.startsWith("#") ? hash.substring(1) : hash
            );

            const recoveryError =
                params.get("error_description") ||
                hashParams.get("error_description");

            if (recoveryError) {
                showRequestForm();

                showMessage(
                    requestMessage,
                    "This recovery link is invalid or expired. Request a new password reset email.",
                    "error"
                );

                return;
            }

            const accessToken =
                hashParams.get("access_token");

            const refreshToken =
                hashParams.get("refresh_token");

            const tokenType =
                hashParams.get("type");

            if (
                accessToken &&
                tokenType === "recovery"
            ) {
                const { error } =
                    await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                if (error) {
                    showRequestForm();

                    showMessage(
                        requestMessage,
                        "This recovery link is invalid or expired. Request a new one.",
                        "error"
                    );

                    return;
                }

                showRecoveryForm();
                return;
            }

            /*
             * PKCE recovery links may contain a code parameter.
             */
            const code = params.get("code");

            if (code) {
                const { data, error } =
                    await supabaseClient.auth.exchangeCodeForSession(code);

                if (error) {
                    showRequestForm();

                    showMessage(
                        requestMessage,
                        "This recovery link could not be verified. Request a new one.",
                        "error"
                    );

                    return;
                }

                if (data.session) {
                    showRecoveryForm();
                    return;
                }
            }

            /*
             * Do not mistake an ordinary logged-in session
             * for a password recovery session.
             */
            showRequestForm();
        }

        /*
         * Request a new recovery email.
         */
        resetRequestForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                if (!email) {
                    showMessage(
                        requestMessage,
                        "Please enter your email address.",
                        "error"
                    );
                    return;
                }

                requestButton.disabled = true;
                requestButton.textContent = "Sending...";

                try {
                    const { error } =
                        await supabaseClient.auth.resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    "https://t-kel.com/Distribution/reset-password.html"
                            }
                        );

                    if (error) {
                        console.error("Recovery request error:", error);

                        showMessage(
                            requestMessage,
                            "Unable to send the reset email. Please try again.",
                            "error"
                        );

                        return;
                    }

                    showMessage(
                        requestMessage,
                        "If an account exists for this email, a reset link has been sent. Check your inbox and spam folder.",
                        "success"
                    );

                    resetRequestForm.reset();

                } catch (error) {
                    console.error("Unexpected recovery error:", error);

                    showMessage(
                        requestMessage,
                        "A connection error occurred. Please try again.",
                        "error"
                    );

                } finally {
                    requestButton.disabled = false;
                    requestButton.textContent = "Send Reset Link";
                }
            }
        );

        /*
         * Save the new password.
         */
        newPasswordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                if (!recoveryDetected) {
                    showMessage(
                        passwordMessage,
                        "Open a valid password recovery link before changing your password.",
                        "error"
                    );
                    return;
                }

                const newPassword =
                    document.getElementById("newPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (newPassword.length < 8) {
                    showMessage(
                        passwordMessage,
                        "Password must contain at least 8 characters.",
                        "error"
                    );
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showMessage(
                        passwordMessage,
                        "The passwords do not match.",
                        "error"
                    );
                    return;
                }

                updateButton.disabled = true;
                updateButton.textContent = "Updating...";

                try {
                    const { error } =
                        await supabaseClient.auth.updateUser({
                            password: newPassword
                        });

                    if (error) {
                        console.error("Password update error:", error);

                        showMessage(
                            passwordMessage,
                            "Password update failed. Your recovery link may have expired. Request a new one if necessary.",
                            "error"
                        );

                        return;
                    }

                    showMessage(
                        passwordMessage,
                        "Your password has been updated successfully. You can now sign in.",
                        "success"
                    );

                    newPasswordForm.reset();
                    recoveryDetected = false;

                    /*
                     * Sign out after changing the password,
                     * then let the artist sign in normally.
                     */
                    await supabaseClient.auth.signOut();

                } catch (error) {
                    console.error("Unexpected password update error:", error);

                    showMessage(
                        passwordMessage,
                        "A connection error occurred. Please try again.",
                        "error"
                    );

                } finally {
                    updateButton.disabled = false;
                    updateButton.textContent = "Update Password";
                }
            }
        );

        initializeRecoveryPage();
    </script>

</body>
</html>
